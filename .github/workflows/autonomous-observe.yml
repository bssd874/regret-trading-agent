name: REGRET autonomous observe cycle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: regret-autonomous-observe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ALPACA_PAPER: "true"
      AUTONOMOUS_AGENT_ENABLED: "true"
      AUTONOMOUS_NEW_ENTRIES_ENABLED: "true"
      PAPER_EXECUTION_ENABLED: "false"
      PUBLIC_AGENT_TRIGGER_ENABLED: "false"
      PUBLIC_WRITE_API_ENABLED: "false"
      AUTONOMOUS_CYCLE_SECONDS: "900"
      AUTONOMOUS_STALE_CYCLE_SECONDS: "1800"
      AUTONOMOUS_MAX_CANDIDATES_PER_CYCLE: "2"

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Run exactly one OBSERVE cycle
        run: python -m backend.scripts.run_autonomous_cycle_once
