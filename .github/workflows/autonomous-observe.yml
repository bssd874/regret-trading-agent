name: REGRET autonomous observe cycle

# FALLBACK ONLY. GitHub's cron is best-effort and has been observed to
# leave multi-hour gaps, so it must not be the sole clock for monitoring
# an open paper position. The primary heartbeat is an external scheduler
# calling POST /api/internal/scheduled-cycle. This schedule stays as a
# secondary safety net; workflow_dispatch remains the immediate ARM path.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      arm_session_id:
        description: >-
          Operator arm session to claim before the cycle. Scheduled runs
          leave this empty and can never arm new entries. Not a secret.
        required: false
        default: ""
      diagnostic_only:
        description: >-
          Run only the read-only database identity diagnostic and exit.
          Starts no cycle, claims no arm session, contacts no provider
          and submits no order. Prints non-secret metadata only.
        required: false
        default: "false"

concurrency:
  group: regret-autonomous-observe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ALPACA_PAPER: "true"
      AUTONOMOUS_AGENT_ENABLED: "true"
      AUTONOMOUS_NEW_ENTRIES_ENABLED: "true"
      PAPER_EXECUTION_ENABLED: "false"
      PUBLIC_AGENT_TRIGGER_ENABLED: "false"
      PUBLIC_WRITE_API_ENABLED: "false"
      AUTONOMOUS_CYCLE_SECONDS: "900"
      AUTONOMOUS_STALE_CYCLE_SECONDS: "1800"
      AUTONOMOUS_MAX_CANDIDATES_PER_CYCLE: "2"

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Run exactly one bounded cycle
        # Passed through the environment, never interpolated into the
        # shell command, so the input cannot inject script.
        env:
          REGRET_ARM_SESSION_ID: ${{ inputs.arm_session_id }}
          REGRET_DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          # Automation must never fall back to the local SQLite database.
          REGRET_REQUIRE_DATABASE_URL: "true"
        run: python -m backend.scripts.run_autonomous_cycle_once
